<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; padding:20px; }
  .slide {
    position:relative; width:1123px; height:794px;
    background:#FFFFFF; overflow:hidden; margin:0 auto 24px;
    font-family:'Paperlogy 4 Regular', sans-serif;
  }
  .slide > div { position:absolute; }

  .eyebrow { left:60px; top:42px; width:500px; height:20px; font-size:13px; color:#999; }
  .eyebrow-b { left:60px; top:63px; width:500px; height:26px;
               font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:17px; color:#1A1A1A; }
  .chapter { left:563px; top:42px; width:500px; height:44px; font-size:13px; color:#999; text-align:right; }
  .pagenum { left:1003px; top:765px; width:60px; height:18px; font-size:11px; color:#999; text-align:right; }
  .glabel { left:60px; top:758px; width:700px; height:20px; font-size:11px; color:#999; }

  /* 상단 헤드라인 */
  .flow-head { left:60px; top:150px; width:1003px; height:48px;
               font-family:'Paperlogy 8 ExtraBold'; font-weight:800; font-size:32px;
               color:#1A1A1A; text-align:center; }
  .flow-sub { left:60px; top:210px; width:1003px; height:26px;
              font-size:15px; color:#666; text-align:center; }

  /* 단계 원 (좌표/크기 inline) */
  .flow-circle { background:#1A1A1A; border-radius:50%; }
  .flow-kw { font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:16px;
             color:#FFFFFF; text-align:center; }
  .flow-no { font-family:'Paperlogy 8 ExtraBold'; font-weight:800; font-size:13px;
             color:#999; text-align:center; }
  .flow-arrow { font-size:30px; color:#999; text-align:center; }
  .flow-desc { font-size:13px; color:#444; text-align:center; line-height:1.5; }

  /* 하단 결론 띠 */
  .flow-foot { left:0; top:660px; width:1123px; height:80px; background:#1A1A1A; }
  .flow-foot-t { left:60px; top:686px; width:1003px; height:32px;
                 font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:18px;
                 color:#FFFFFF; text-align:center; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="eyebrow-b">{{eyebrow_b}}</div>
  <div class="chapter">{{chapter}}</div>

  <div class="flow-head">{{head}}</div>
  <div class="flow-sub">{{sub}}</div>

  {{steps}}

  <div class="flow-foot"></div>
  <div class="flow-foot-t">{{foot}}</div>

  <div class="glabel">{{glabel}}</div>
  <div class="pagenum">{{pagenum}}</div>
</div>
</body>
</html>
