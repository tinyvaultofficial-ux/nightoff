<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#888; padding:20px; }
.slide { position:relative; width:1123px; height:794px; background:#FFFFFF; overflow:hidden; margin:0 auto 24px; font-family:'Paperlogy 4 Regular', sans-serif; }
.slide > div { position:absolute; }
.eyebrow { left:60px; top:42px; width:500px; height:20px; font-size:13px; color:#999; }
.eyebrow-b { left:60px; top:63px; width:500px; height:26px; font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:17px; color:#1A1A1A; }
.chapter { left:563px; top:42px; width:500px; height:44px; font-size:13px; color:#999; text-align:right; }
.gov-main { left:60px; top:108px; width:1003px; height:44px; font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:28px; color:#1A1A1A; }
.gov-sub { left:60px; top:158px; width:1003px; height:26px; font-size:15px; color:#444; }
.divline { left:60px; top:196px; width:1003px; height:0; border-top:1px solid #DDD; }
.glabel { left:60px; top:758px; width:700px; height:20px; font-size:11px; color:#999; }
.pagenum { left:1003px; top:765px; width:60px; height:18px; font-size:11px; color:#999; text-align:right; }
.org-top { background:#1A1A1A; font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:18px; color:#FFFFFF; text-align:center; }
.org-hline { height:0; border-top:1px solid #999; }
.org-vline { width:0; border-left:1px solid #999; }
.org-team { border:2px solid #1A1A1A; font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:16px; color:#1A1A1A; text-align:center; }
.org-task { border:1px solid #DDD; background:#F4F4F4; font-size:13px; color:#666; text-align:center; line-height:1.6; }
.org-band { width:1003px; height:56px; background:#444; font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:14px; color:#FFFFFF; text-align:center; line-height:56px; }
</style></head><body>
<div class="slide">
<div class="eyebrow">{{eyebrow}}</div>
<div class="eyebrow-b">{{eyebrow_b}}</div>
<div class="chapter">{{chapter}}</div>
<div class="gov-main">{{gov_main}}</div>
<div class="gov-sub">{{gov_sub}}</div>
<div class="divline"></div>
{{tree}}
<div class="glabel">{{glabel}}</div>
<div class="pagenum">{{pagenum}}</div>
</div></body></html>
