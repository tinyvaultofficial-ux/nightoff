<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; padding:20px; }
  .slide {
    position:relative; width:1123px; height:794px;
    background:#FFFFFF; overflow:hidden; margin:0 auto 24px;
    font-family:'Paperlogy 4 Regular', sans-serif;
  }
  .slide > div { position:absolute; }

  .eyebrow { left:60px; top:42px; width:500px; height:20px; font-size:13px; color:#999; }
  .eyebrow-b { left:60px; top:63px; width:500px; height:26px;
               font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:17px; color:#1A1A1A; }
  .chapter { left:563px; top:42px; width:500px; height:44px; font-size:13px; color:#999; text-align:right; }
  .pagenum { left:1003px; top:765px; width:60px; height:18px; font-size:11px; color:#999; text-align:right; }
  .glabel { left:60px; top:758px; width:700px; height:20px; font-size:11px; color:#999; }

  /* 배경 사진 placeholder (영역3, 사용자 몫) */
  .kpi-bg { left:60px; top:240px; width:1003px; height:420px;
            border:1px dashed #999; background:#F4F4F4; }
  .kpi-bg-label { left:60px; top:440px; width:1003px; height:24px;
                  font-size:13px; color:#999; text-align:center; }

  /* 상단 카피 */
  .kpi-head-s { left:60px; top:150px; width:1003px; height:24px;
                font-size:15px; color:#666; text-align:center; }
  .kpi-head { left:60px; top:178px; width:1003px; height:44px;
              font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:26px;
              color:#1A1A1A; text-align:center; }

  /* 하단 띠 */
  .kpi-foot { left:0; top:680px; width:1123px; height:74px; background:#1A1A1A; }
  .kpi-foot-t { left:60px; top:702px; width:1003px; height:32px;
                font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:15px;
                color:#FFFFFF; text-align:center; line-height:1.5; }

  /* 원형 지표 (좌표/크기는 조립기가 inline으로 지정, 디자인만 여기) */
  .kpi-circle { background:#1A1A1A; border-radius:50%; }
  .kpi-delta { font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:14px;
               color:#444; text-align:center; }
  .kpi-arrow { font-size:13px; color:#999; text-align:center; }
  .kpi-label { font-family:'Paperlogy 7 Bold'; font-weight:bold; font-size:15px;
               color:#FFFFFF; text-align:center; }
  .kpi-value { font-family:'Paperlogy 8 ExtraBold'; font-weight:800;
               color:#FFFFFF; text-align:center; }
  .kpi-note { font-size:12px; color:#666; text-align:center; }
</style></head>
<body>
<div class="slide">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="eyebrow-b">{{eyebrow_b}}</div>
  <div class="chapter">{{chapter}}</div>

  <div class="kpi-head-s">{{head_sub}}</div>
  <div class="kpi-head">{{head_main}}</div>

  <div class="kpi-bg"></div>
  <div class="kpi-bg-label">[ 배경 이미지 자리 — 사용자가 행사 사진을 깔면 캡쳐처럼 완성됩니다 ]</div>

  {{circles}}

  <div class="kpi-foot"></div>
  <div class="kpi-foot-t">{{foot}}</div>

  <div class="glabel">{{glabel}}</div>
  <div class="pagenum">{{pagenum}}</div>
</div>
</body>
</html>
