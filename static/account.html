<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 · NightOff</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preload" as="font" href="/static/fonts/Paperlogy-7Bold.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/static/fonts/Paperlogy-4Regular.ttf" type="font/ttf" crossorigin />
  <style>
    /* Spec D-Fix-10 (5/19) — 일반 사용자 마이페이지 (이메일 + 회원 탈퇴 링크) */
    body {
      background: #FAFAFA;
      font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      color: #1F1147;
    }
    .account-page {
      max-width: 640px;
      margin: 40px auto;
      padding: 40px 36px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .account-page h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1F1147;
      margin: 0 0 32px;
      letter-spacing: -0.3px;
    }
    .account-info-box {
      background: #FAFAFF;
      border: 1px solid #EEE;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .account-info-label {
      font-size: 13px;
      color: #888;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .account-info-value {
      font-size: 15px;
      color: #1F1147;
      font-weight: 600;
      margin: 0;
      word-break: break-all;
    }
    .account-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid #EEE;
    }
    .account-btn-back {
      padding: 11px 20px;
      background: #6B46E5;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
      font-family: inherit;
    }
    .account-btn-back:hover {
      opacity: 0.9;
    }
    .account-withdraw-link {
      font-size: 13px;
      color: #999;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .account-withdraw-link:hover {
      color: #E74C3C;
    }
    /* Spec D-Build-OurCompany-2 — 회사 정보 폼 */
    .account-company-section { margin-top: 24px; text-align: left; }
    .account-company-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: #1F1147; }
    .account-company-desc { font-size: 13px; color: #6B6B6B; margin: 0 0 16px; }
    .company-acc { border: 1px solid #E5E5E5; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .company-acc-title { cursor: pointer; padding: 12px 16px; font-size: 14px; font-weight: 600; color: #1F1147; list-style: none; border-left: 3px solid #6B46E5; }
    .company-acc[open] .company-acc-title { background: #F5F0FF; }
    .company-acc-title::-webkit-details-marker { display: none; }
    .company-acc-hint { font-size: 12px; font-weight: 400; color: #999; margin-left: 4px; }
    .company-acc-body { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .company-field { display: flex; flex-direction: column; }
    .company-field label { font-size: 12px; color: #666; margin-bottom: 5px; }
    .company-field input, .company-field textarea {
      padding: 10px 12px; font-size: 14px; border: 1px solid #DDD; border-radius: 8px;
      background: #FAFAFA; font-family: inherit; color: #1F1147; outline: none;
    }
    .company-field input:focus, .company-field textarea:focus { border-color: #6B46E5; background: #fff; }
    .company-field textarea { resize: vertical; }
    .company-field:has(textarea) { grid-column: 1 / -1; }
    .account-btn-save {
      margin-top: 8px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      color: #fff; background: #6B46E5; border: none; border-radius: 10px; cursor: pointer;
      font-family: inherit;
    }
    .account-btn-save:hover { background: #5A37D4; }
    .account-btn-save:disabled { opacity: 0.6; cursor: default; }
    @media (max-width: 560px) { .company-acc-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="account-page">
    <h1>👤 마이페이지</h1>

    <div class="account-info-box">
      <p class="account-info-label">이메일</p>
      <p class="account-info-value" id="user-email">불러오는 중…</p>
    </div>

    <section class="account-company-section">
      <h2 class="account-company-title">🏢 우리 회사 정보</h2>
      <p class="account-company-desc">한 번 입력해두면 과업마다 제출서류에 채워 넣습니다.</p>

      <details class="company-acc" open>
        <summary class="company-acc-title">핵심 정보</summary>
        <div class="company-acc-body">
          <div class="company-field">
            <label for="fld-company_name">상호(법인명)</label>
            <input id="fld-company_name" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-biz_no">사업자등록번호</label>
            <input id="fld-biz_no" type="text" placeholder="000-00-00000" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-ceo_name">대표자명</label>
            <input id="fld-ceo_name" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-ceo_birth">대표자 생년월일</label>
            <input id="fld-ceo_birth" type="text" placeholder="YYYY-MM-DD" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-address">주소(소재지)</label>
            <input id="fld-address" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-phone">대표전화</label>
            <input id="fld-phone" type="text" placeholder="02-0000-0000" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-email">이메일</label>
            <input id="fld-email" type="text" autocomplete="off">
          </div>
        </div>
      </details>

      <details class="company-acc">
        <summary class="company-acc-title">자주 쓰는 정보 <span class="company-acc-hint">선택</span></summary>
        <div class="company-acc-body">
          <div class="company-field">
            <label for="fld-corp_no">법인등록번호</label>
            <input id="fld-corp_no" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-fax">팩스</label>
            <input id="fld-fax" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-biz_type">업태</label>
            <input id="fld-biz_type" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-biz_item">종목</label>
            <input id="fld-biz_item" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-founded_year">설립연도</label>
            <input id="fld-founded_year" type="text" placeholder="YYYY" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-capital_krw">자본금(원)</label>
            <input id="fld-capital_krw" type="number" min="0" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-employee_count">임직원 수</label>
            <input id="fld-employee_count" type="number" min="0" autocomplete="off">
          </div>
        </div>
      </details>

      <details class="company-acc">
        <summary class="company-acc-title">심화 정보 <span class="company-acc-hint">선택</span></summary>
        <div class="company-acc-body">
          <div class="company-field">
            <label for="fld-history_text">주요 연혁</label>
            <textarea id="fld-history_text" rows="3"></textarea>
          </div>
          <div class="company-field">
            <label for="fld-business_text">주요 사업내용</label>
            <textarea id="fld-business_text" rows="3"></textarea>
          </div>
          <div class="company-field">
            <label for="fld-credit_grade">신용평가등급</label>
            <input id="fld-credit_grade" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-contact_name">담당자명</label>
            <input id="fld-contact_name" type="text" autocomplete="off">
          </div>
          <div class="company-field">
            <label for="fld-contact_phone">담당자 연락처</label>
            <input id="fld-contact_phone" type="text" autocomplete="off">
          </div>
        </div>
      </details>

      <button id="company-save-btn" class="account-btn-save" type="button">저장</button>
    </section>

    <div class="account-actions">
      <a href="/" class="account-btn-back">← 대시보드로</a>
      <a href="/withdraw.html" class="account-withdraw-link">회원 탈퇴</a>
    </div>
  </div>

  <script>
    // Spec D-Fix-10 (5/19) — 사용자 정보 로드 (이메일 표시)
    (async function loadUserInfo() {
      const emailEl = document.getElementById("user-email");

      // 1. 토큰 체크 — 없으면 로그인 페이지로
      const token = localStorage.getItem("nightoff_jwt");
      if (!token) {
        window.location.href = "/login.html";
        return;
      }

      // 2. /api/auth/me 호출
      try {
        const res = await fetch("/api/auth/me", {
          headers: { "Authorization": `Bearer ${token}` },
        });

        if (res.status === 401) {
          // 인증 실패 (만료 / 무효 / 탈퇴) → 로그인 페이지
          localStorage.removeItem("nightoff_jwt");
          window.location.href = "/login.html";
          return;
        }

        if (res.ok) {
          const data = await res.json();
          emailEl.textContent = (data.user && data.user.email) || "(이메일 정보 없음)";
        } else {
          emailEl.textContent = "(불러오기 실패)";
        }
      } catch (err) {
        emailEl.textContent = "(네트워크 오류)";
        console.error("Failed to load user info:", err);
      }
    })();

    // Spec D-Build-OurCompany-2 — 회사 정보 폼 GET prefill + 전체 PUT
    const FIELDS = [
      "company_name","biz_no","ceo_name","ceo_birth","address","phone","email",
      "corp_no","fax","biz_type","biz_item","founded_year","capital_krw","employee_count",
      "history_text","business_text","credit_grade","contact_name","contact_phone"
    ];
    const INT_FIELDS = ["capital_krw","employee_count"];

    async function loadCompany() {
      const token = localStorage.getItem("nightoff_jwt");
      if (!token) return;
      try {
        const r = await fetch("/api/me/company", {
          headers: { "Authorization": `Bearer ${token}` },
        });
        if (r.status === 401) {
          localStorage.removeItem("nightoff_jwt");
          window.location.href = "/login.html"; return;
        }
        if (!r.ok) return;
        const { company } = await r.json();
        if (!company) return;                       // 미입력 사용자 = 빈 폼 유지
        FIELDS.forEach(f => {
          const el = document.getElementById("fld-" + f);
          if (el != null && company[f] != null) el.value = company[f];
        });
      } catch (e) { /* 네트워크 실패 시 빈 폼 유지 */ }
    }

    async function saveCompany() {
      const token = localStorage.getItem("nightoff_jwt");
      if (!token) { window.location.href = "/login.html"; return; }
      const btn = document.getElementById("company-save-btn");
      const body = {};
      FIELDS.forEach(f => {
        const el = document.getElementById("fld-" + f);
        let v = el ? el.value.trim() : "";
        if (INT_FIELDS.includes(f)) v = parseInt(v || "0", 10) || 0;
        body[f] = v;                                // 전체 필드 항상 전송 (PUT = 전체 덮어쓰기)
      });
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "저장 중...";
      try {
        const r = await fetch("/api/me/company", {
          method: "PUT",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify(body),
        });
        if (r.status === 401) {
          localStorage.removeItem("nightoff_jwt");
          window.location.href = "/login.html"; return;
        }
        if (r.ok) { alert("회사 정보가 저장됐어요."); }
        else if (r.status === 422) { alert("입력 형식을 확인해 주세요. (자본금·임직원 수는 숫자)"); }
        else { alert("저장에 실패했어요. 잠시 후 다시 시도해 주세요."); }
      } catch (e) {
        alert("서버에 연결할 수 없어요. 네트워크를 확인해 주세요.");
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    document.getElementById("company-save-btn").addEventListener("click", saveCompany);
    loadCompany();
  </script>
</body>
</html>
