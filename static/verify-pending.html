<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이메일 인증 · NightOff</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="preload" as="font" href="/static/fonts/Paperlogy-7Bold.ttf" type="font/ttf" crossorigin />
  <link rel="preload" as="font" href="/static/fonts/Paperlogy-4Regular.ttf" type="font/ttf" crossorigin />
  <!-- Spec D-Build-AuthPagesLinear (2026-09-02): style.css 링크 추가 (:root 변수 참조 위해). -->
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Spec D-Fix-8 (5/18) — 이메일 인증 안내 페이지.
       Spec D-Build-AuthPagesLinear (2026-09-02) — Linear 정합:
       ── body bg #FAFAFF → var(--bg), color → var(--fg-strong).
       ── 카드 radius 14→12 · shadow 튀는값 → var(--shadow-sm) · bg → var(--card).
       ── resend gradient bg → var(--primary) 단색 · radius 10 → var(--radius).
       ── 하드코딩 색 (#6E56CF/#1F1147/#555/#F5F0FF/#2D9D78/#C0392B) → 앱 변수.
       ── ★ .verify-pending-hint/-login 은 조각1 --fg-soft 무접촉. */
    body {
      background: var(--bg);
      font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--fg-strong);
    }
    .verify-pending {
      max-width: 480px;
      width: 100%;
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .verify-pending-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .verify-pending h1 {
      font-size: var(--text-md);
      font-weight: 700;
      color: var(--fg-strong);
      margin: 0 0 12px;
      letter-spacing: -0.3px;
      line-height: var(--lh-tight);
    }
    .verify-pending-desc {
      font-size: var(--text-sm);
      color: var(--fg);
      line-height: var(--lh-base);
      margin: 0 0 20px;
    }
    .verify-pending-email {
      display: inline-block;
      padding: 8px 16px;
      background: var(--primary-soft);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 28px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .verify-pending-hint {
      font-size: var(--text-sm);
      color: var(--fg-soft);
      line-height: var(--lh-base);
      margin: 0 0 20px;
    }
    /* 인라인 style="margin-top:24px" → 클래스 (2번째 hint 블록) */
    .verify-pending-hint-block { margin-top: 24px; }
    .verify-pending-resend {
      width: 100%;
      padding: 13px 24px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: var(--text-sm);
      font-weight: 700;
      line-height: var(--lh-tight);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      font-family: inherit;
    }
    .verify-pending-resend:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .verify-pending-resend:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .verify-pending-status {
      font-size: var(--text-sm);
      color: var(--fg-soft);
      margin: 12px 0 0;
      min-height: 18px;
      line-height: var(--lh-base);
    }
    .verify-pending-status.success { color: var(--success); }
    .verify-pending-status.error { color: var(--danger); }
    .verify-pending-login {
      margin: 24px 0 0;
      font-size: var(--text-sm);
      color: var(--fg-soft);
    }
    .verify-pending-login a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .verify-pending-login a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="verify-pending">
    <div class="verify-pending-icon">📧</div>
    <h1>이메일을 확인해주세요</h1>
    <p class="verify-pending-desc">가입하신 이메일 주소로 인증 링크를 보냈어요.</p>
    <div class="verify-pending-email" id="email-display">—</div>
    <p class="verify-pending-hint">
      메일이 도착하지 않았다면 스팸 메일함을 확인하거나<br>
      아래 버튼을 눌러 재발송해주세요.
    </p>
    <button class="verify-pending-resend" id="resend-btn" type="button">재발송</button>
    <p class="verify-pending-status" id="resend-status"></p>
    <p class="verify-pending-hint verify-pending-hint-block">
      인증을 완료하면 이 탭이 자동으로 대시보드로 이동해요.<br>
      다른 기기에서 인증했다면 아래 '로그인'을 눌러주세요.
    </p>
    <p class="verify-pending-login">
      이미 인증했어요 → <a href="/login.html">로그인</a>
    </p>
  </div>
  <script>
    // URL ?email=xxx 추출
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email") || "";
    if (email) {
      document.getElementById("email-display").textContent = email;
    } else {
      document.getElementById("email-display").style.display = "none";
    }

    const btn = document.getElementById("resend-btn");
    const status = document.getElementById("resend-status");

    function showStatus(msg, cls) {
      status.textContent = msg;
      status.className = "verify-pending-status" + (cls ? " " + cls : "");
    }

    function startCooldown(seconds) {
      let remaining = seconds;
      btn.disabled = true;
      btn.textContent = `재발송 (${remaining}초 후 가능)`;
      const timer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = "재발송";
        } else {
          btn.textContent = `재발송 (${remaining}초 후 가능)`;
        }
      }, 1000);
    }

    // Spec UX-VerifyPendingAutoTransition — 가입 탭 자동 전환.
    // 메일 인증 완료 시 _render_verify_success (main.py:1002) 가 localStorage 에
    // "nightoff_jwt" 저장 → 같은 도메인 모든 탭 공유(브라우저 표준) → 이 탭도 자동 감지.
    // ★ polling 아님: 서버 호출 0, 자기 localStorage 만 읽음(보안 영역 0).
    // 다른 브라우저/디바이스에서 인증한 경우엔 작동 X → "이미 인증했어요 → 로그인" 링크 폴백.
    function checkAuthToken() {
      if (localStorage.getItem("nightoff_jwt")) {
        location.href = "/";
      }
    }
    checkAuthToken();             // 진입 즉시 1회 (이미 인증된 채 이 페이지 도달한 케이스)
    setInterval(checkAuthToken, 5000);

    btn.addEventListener("click", async () => {
      if (!email) {
        showStatus("이메일 정보가 없어요. 다시 가입해주세요.", "error");
        return;
      }
      btn.disabled = true;
      showStatus("발송 중...", "");
      try {
        const res = await fetch("/api/auth/resend-verification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (res.ok) {
          showStatus("✅ 재발송 완료. 메일을 확인해주세요.", "success");
          startCooldown(60);
        } else if (res.status === 429) {
          const data = await res.json().catch(() => ({}));
          const retryAfter = (data.detail && data.detail.retry_after) || 60;
          showStatus("⏱️ 잠시 후 다시 시도해주세요.", "error");
          startCooldown(retryAfter);
        } else {
          showStatus("❌ 발송 실패. 잠시 후 다시 시도해주세요.", "error");
          btn.disabled = false;
          btn.textContent = "재발송";
        }
      } catch (err) {
        showStatus("❌ 네트워크 오류. 잠시 후 다시 시도해주세요.", "error");
        btn.disabled = false;
        btn.textContent = "재발송";
      }
    });
  </script>
</body>
</html>
